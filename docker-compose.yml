# Local development only. Port 5436 avoids clashing with other local Postgres instances.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - crm-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  crm-pgdata:
