/* ---------- list ---------- */
function tabsHTML(){const base=C.filter(open_);$('tabs').querySelectorAll('.tab').forEach(e=>e.remove());
 $('tabs').insertAdjacentHTML('afterbegin',TABS.map(t=>`<button class="tab ${t[0]===S.tab?'on':''}" role="tab" aria-selected="${t[0]===S.tab}" data-t="${t[0]}">${t[1]} <b>${base.filter(t[2]).length}</b></button>`).join(''));moveInd()}
function moveInd(){const a=$('tabs').querySelector('.on');if(!a)return;$('ind').style.width=a.offsetWidth-16+'px';$('ind').style.transform=`translateX(${a.offsetLeft+8}px)`}
function rowsHTML(fresh){const v=visible();if(!v.length)return S.q||S.tab!=='all'?`<div class="empty"><div><div class="ic">${I('search','lg')}</div><b>${S.q?'No match for “'+esc(S.q)+'”':'Nothing here'}</b>${S.q?'Try a name, phone number or a word from the message.':'Conversations that fit this filter will appear here.'}<br><button class="btn" style="margin-top:12px" id="reset">Clear filters</button></div></div>`:`<div class="empty"><div><div class="ic">${I('inbox','lg')}</div><b>Inbox zero</b>Every conversation is done. New messages will show up here.</div></div>`;
 let i=0,g='';return v.map(c=>{const h=c.grp!==g?`<div class="sec">${g=c.grp}</div>`:'';
 return h+`<a href="#" class="row ${c.un?'un':''} ${c.id===S.sel?'on':''}" data-id="${c.id}" style="--i:${fresh?Math.min(i++,10):0};${fresh?'':'animation:none'}"><div class="avatar s40 ${c.tone}">${c.av}<span class="mark ${c.ch==='ig'?'ig':'m'}">${I(CHN[c.ch][1])}</span></div><div class="t"><div class="l1"><span class="nm">${hl(c.name)}</span><time>${c.age}</time></div><div class="l2"><span class="pv bn">${c.draft?'<i>Draft: </i>'+esc(c.draft):preview(c)}</span><span class="dot" title="Unread"></span></div></div></a>`}).join('')}
const SK=Array(6).fill('<div class="sk"><div class="c"></div><div style="flex:1;display:grid;gap:8px;align-content:center"><i style="width:45%"></i><i style="width:80%"></i></div></div>').join('');
function renderList(fresh=true){tabsHTML();const st=S.state;
 $('rows').setAttribute('aria-busy',st==='loading');
 $('rows').innerHTML=st==='loading'?SK:st==='empty'?`<div class="empty"><div><div class="ic">${I('inbox','lg')}</div><b>No conversations yet</b>Messages from Messenger and Instagram land here.<br><a href="#" style="color:var(--accent);font-weight:500;text-decoration:none">Connect a channel</a></div></div>`:st==='error'?`<div class="empty"><div><b>Could not load conversations</b>Check your connection. Nothing was lost.<br><button class="btn" style="margin-top:12px" onclick="setState('normal')">Try again</button></div></div>`:rowsHTML(fresh);
 document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.k===st))}
function setState(k){S.state=k;renderList()}

/* ---------- thread ---------- */
function msgsHTML(c){let out=`<span class="day">${c.day}</span>`,lastOut=-1;c.msgs.forEach((m,i)=>{if(m.d==='out')lastOut=i});
 c.msgs.forEach((m,i)=>{const n=c.msgs[i+1],run=n&&n.d===m.d&&n.ext===m.ext&&n.by===m.by&&!m.note;
  if(i===c.newFrom)out+=`<div class="newl">${c.un>1?c.un+' new messages':'New message'}</div>`;
  const meta=run?'':`<div class="meta">${m.ext?'<span class="src">Sent from Meta app</span>':m.note?'Internal note · only your team sees this':m.by?esc(m.by):''}${m.ext||m.by||m.note?' · ':''}${esc(m.time)}${m.d==='out'&&i===lastOut&&!m.note?`<span class="ok">${I('check')}Sent</span>`:''}</div>`;
  out+=`<div class="g ${m.d} ${run?'run':''}" style="animation-delay:${Math.min(i,8)*30}ms"><div class="b bn ${m.ext?'ext':''} ${m.note?'nt':''}">${esc(m.text)}</div>${meta}</div>`});return out}
function winHTML(c){return c.win?`<div class="win"><span class="chip ok">Reply window open</span>Customer wrote ${c.win<=24?'recently':''}, you can reply for ${c.win}h more</div>`:`<div class="win"><span class="chip warn">Reply window closed</span>Meta only allows replies within 24h of the customer’s last message. Notes still work.</div>`}
function renderThread(){const c=cur(),t=$('thread');
 if(!c){t.innerHTML=`<div class="empty"><div><div class="ic">${I('inbox','lg')}</div><b>Select a conversation</b>Pick one from the list to read and reply. Use <span class="kbd" style="margin:0">J</span> <span class="kbd" style="margin:0">K</span> to move.</div></div>`;return}
 const ch=CHN[c.ch],locked=!c.win&&S.mode==='reply';
 t.innerHTML=`<div class="th"><button class="btn icon ghost back" id="bk" aria-label="Back to inbox">${I('right').replace('class="i "','class="i " style="transform:rotate(180deg)"')}</button><div class="avatar s40 ${c.tone}">${c.av}<span class="mark ${c.ch==='ig'?'ig':'m'}">${I(ch[1])}</span></div><div class="who"><b>${esc(c.name)}</b><span><span class="chip" style="height:18px;font-size:11px">${I(ch[1],'sm')}${ch[0]}</span>Testingdemo</span></div><div class="sp"></div>
 <button class="sel" id="bSt" title="Lead stage" aria-haspopup="menu"><i class="sd" style="background:${c.lead?STG[c.lead[1]][1]:'var(--line-2)'}"></i><span class="lbl">Stage</span>${c.lead?STG[c.lead[1]][0]:'No lead'} ${I('down','sm')}</button>
 <button class="sel" id="bAs">${I('user','sm')}${c.as?ME:'Unassigned'} ${I('down','sm')}</button>
 <button class="sel pt ${S.panel?'on':''}" id="pn" aria-pressed="${S.panel}" title="Contact (C)">${I('panel','sm')}Contact</button><button class="btn icon ghost" id="bMo" aria-label="More actions" aria-haspopup="menu">${I('more')}</button></div>
 <div class="view"><div class="msgs bn" id="msgs">${msgsHTML(c)}</div>
 <button class="jump" id="jump">${I('down','sm')}Latest</button>
 <div class="comp">${winHTML(c)}<div class="box ${S.mode==='note'?'note':''} ${locked?'lock':''}" id="box"><div class="mode"><button class="${S.mode==='reply'?'on':''}" data-m="reply">Reply on ${ch[0]}</button><button class="${S.mode==='note'?'on':''}" data-m="note">${I('lock','sm')}Internal note</button></div>
 <textarea class="bn" id="ta" rows="2" ${locked?'disabled':''} placeholder="${locked?'Replies are closed. Switch to Internal note to leave a note.':S.mode==='note'?'Write a note for your team…':'Write a reply…  (type / for saved replies)'}" aria-label="Reply">${esc(c.draft)}</textarea>
 <div class="tools"><button class="btn icon ghost" aria-label="Attach file" title="Attach">${I('clip')}</button><button class="btn icon ghost" aria-label="Emoji" title="Emoji">${I('smile')}</button><button class="btn icon ghost" id="qr" aria-label="Saved replies" title="Saved replies">${I('reply')}</button><span class="hint"><span class="kbd" style="margin:0">Enter</span> send · <span class="kbd" style="margin:0">Shift Enter</span> new line</span><button class="btn pri" id="snd" disabled title="Write a message to send">Send</button></div></div></div></div>`;
 const m=$('msgs');requestAnimationFrame(()=>{m.style.scrollBehavior='auto';m.scrollTop=m.scrollHeight;m.style.scrollBehavior=''});
 const ta=$('ta');autosize();ta.oninput=()=>{c.draft=ta.value;autosize();$('snd').disabled=!ta.value.trim();if(ta.value==='/')quick()};
 ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
 m.onscroll=()=>$('jump').classList.toggle('show',m.scrollHeight-m.scrollTop-m.clientHeight>240);
 $('jump').onclick=()=>{m.scrollTop=m.scrollHeight};
 $('bk').onclick=()=>$('page').classList.remove('t');$('pn').onclick=()=>togglePanel();
 $('snd').onclick=send;$('qr').onclick=quick;
 $('box').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.m;const d=c.draft;renderThread();if(!$('ta').disabled)$('ta').focus()});
 $('bSt').onclick=e=>stageMenu(e.currentTarget,c);
 $('bMo').onclick=e=>pop(e.currentTarget,[['Mark as unread','msg',()=>{c.un=1;c.newFrom=-1;renderList(false);toast('Marked as unread')}],['Close conversation','ccheck',()=>closeConv(c)]],-1);
 $('bAs').onclick=e=>pop(e.currentTarget,[['Unassigned','user',()=>assign(c,null)],[ME+' (me)','user',()=>assign(c,'MM')]],c.as?1:0)}
function autosize(){const t=$('ta');if(!t)return;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px'}
function send(){const c=cur(),ta=$('ta'),v=ta.value.trim();if(!v||ta.disabled)return;const note=S.mode==='note';
 c.msgs.push(note?{d:'out',text:v,time:'now',by:ME,note:1}:{d:'out',text:v,time:'now',by:ME,pend:1});c.draft='';c.newFrom=-1;c.un=0;c.age='now';
 const m=$('msgs');const last=c.msgs.length-1;
 $('thread').querySelector('.msgs').innerHTML=msgsHTML(c);if(!note){const b=$('msgs').querySelector('.g:last-child .b');b.classList.add('pend');$('msgs').querySelector('.g:last-child .meta').innerHTML=`${ME} · now · Sending…`;
  setTimeout(()=>{if(!b.isConnected)return;b.classList.remove('pend');$('msgs').querySelector('.g:last-child .meta').innerHTML=`${ME} · now<span class="ok">${I('check')}Sent</span>`;delete c.msgs[last].pend},900)}
 ta.value='';autosize();$('snd').disabled=true;m.scrollTop=m.scrollHeight;renderList(false)}
function quick(){const ta=$('ta');if(!ta||ta.disabled)return;const a=$('qr');if(ta.value==='/')ta.value='';
 pop(a,REPLIES.map(r=>[r[0],'reply',()=>{ta.value=r[1];ta.dispatchEvent(new Event('input'));ta.focus()}]),-1,'Saved replies')}

/* ---------- contact panel ---------- */
function renderCtx(){const c=cur(),el=$('ctx');if(!c){el.innerHTML='';return}
 const other=C.find(x=>x.name===c.name&&x.id!==c.id),n=other?2:1;
 el.innerHTML=`<div class="card"><div class="prof"><div class="avatar s56 ${c.tone}">${c.av}</div><div><b>${esc(c.name)}</b><span class="chip" style="margin-top:4px">${n} channel${n>1?'s':''}</span></div><button class="btn icon ghost x" id="cx" aria-label="Close contact panel">${I('x')}</button></div></div>
 <div class="card"><h4>Details <a href="#">Edit</a></h4>
 ${c.email?`<div class="kv">${I('mail')}<span>${esc(c.email)}</span><button class="btn icon ghost" data-copy="${esc(c.email)}" aria-label="Copy email">${I('copy','sm')}</button></div>`:''}
 ${c.phone?`<div class="kv">${I('phone')}<span class="tnum">${esc(c.phone)}</span><button class="btn icon ghost" data-copy="${esc(c.phone)}" aria-label="Copy phone">${I('copy','sm')}</button></div>`:''}
 ${!c.email&&!c.phone?'<p class="note" style="margin:0">No email or phone yet. They are saved here when the customer shares them in chat.</p>':''}
 ${c.det?'<div class="note" style="margin:2px 0 6px 26px">Auto-detected from the Messenger chat</div>':''}
 ${other?`<a class="lnk" href="#" data-go="${other.id}">${I(CHN[other.ch][1])}Also on ${CHN[other.ch][0]}<em>${other.age} ago</em></a>`:''}</div>
 ${c.lead?`<div class="card"><h4>Lead <a href="#">Open</a></h4><div class="lead"><b style="font-size:13px">${esc(c.lead[0])}</b><button class="sel" id="cSt" style="width:100%;justify-content:flex-start;margin-top:8px"><i class="sd" style="background:${STG[c.lead[1]][1]}"></i><span class="lbl">Stage</span>${STG[c.lead[1]][0]}<span style="margin-left:auto;display:flex">${I('down','sm')}</span></button>${c.lead[2]?`<div class="note" style="margin-top:6px">Reason: ${esc(c.lead[2])}</div>`:''}<div class="stg">${[0,1,2,3].map(i=>`<i class="${c.lead[1]===4?'l':i<=c.lead[1]?'f':''}" style="animation-delay:${i*60}ms"></i>`).join('')}</div></div></div>`:`<div class="card"><h4>Lead</h4><button class="btn" id="cNew" style="width:100%;justify-content:center">${I('plus','sm')}Create lead</button></div>`}
 <div class="card"><h4>Tasks <a href="#">Add</a></h4>${c.tasks.length?c.tasks.map(t=>`<label class="task"><input type="checkbox"><span>${esc(t[0])}<small>${esc(t[1])}</small></span></label>`).join(''):'<p class="note" style="margin:0">No open tasks.</p>'}</div>
 <div class="card" style="border:0"><button class="btn" style="width:100%;justify-content:center">Open contact ${I('up','sm')}</button></div>`;
 $('cx').onclick=()=>togglePanel(false);const cn=$('cNew');if(cn)cn.onclick=()=>{c.lead=['New lead',0];renderThread();renderCtx();toast('Lead created in New')};const cs=$('cSt');if(cs)cs.onclick=e=>stageMenu(e.currentTarget,c);
 el.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(b.dataset.copy);toast('Copied to clipboard')});
 el.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();select(+a.dataset.go)})}
function togglePanel(v){S.panel=v===undefined?!S.panel:v;localStorage.setItem('ctx',S.panel?'1':'0');$('ctxw').classList.toggle('open',S.panel);const p=$('pn');if(p){p.classList.toggle('on',S.panel);p.setAttribute('aria-pressed',S.panel)}}

/* ---------- actions ---------- */
function select(id,keep){S.sel=id;const c=cur();if(c&&c.un){setTimeout(()=>{c.un=0;tabsHTML();document.querySelector(`.row[data-id="${id}"]`)?.classList.remove('un')},350)}
 document.querySelectorAll('.row').forEach(r=>r.classList.toggle('on',+r.dataset.id===id));
 const row=document.querySelector(`.row[data-id="${id}"]`);row&&row.scrollIntoView({block:'nearest'});
 S.mode='reply';renderThread();renderCtx();$('page').classList.add('t')}
const STG=[['New','#8A93A6'],['Contacted','#2F6FDB'],['Qualified','#4F46E5'],['Won','#17A05D'],['Lost','#B42318']];
const REASONS=['Price too high','No response','Chose a competitor','Not a good fit'];
function stageMenu(a,c){if(!c.lead)return pop(a,[['Create lead','plus',()=>{c.lead=['New lead',0];renderThread();renderCtx();toast('Lead created in New')}]],-1,'Lead');
 pop(a,STG.map((g,i)=>[g[0],'',()=>moveStage(a,c,i),g[1]]),c.lead[1],'Move lead to stage')}
function moveStage(a,c,i){const prev=c.lead[1];if(i===prev)return;if(i===4)return pop(a,REASONS.map(r=>[r,'x',()=>commitStage(c,i,prev,r)]),-1,'Why was it lost?');commitStage(c,i,prev)}
function commitStage(c,i,prev,why){const old=c.lead[2];c.lead[1]=i;c.lead[2]=why||null;renderThread();renderCtx();
 toast(i===3?'Lead marked won':i===4?'Lead marked lost: '+why:'Lead moved to '+STG[i][0],()=>{c.lead[1]=prev;c.lead[2]=old;renderThread();renderCtx()},'Undo')}
function closeConv(c){advance(c);c.st='done'}
function advance(c){const v=visible(),i=v.findIndex(x=>x.id===c.id),nx=v[i+1]||v[i-1]&&v[i-1];
 const el=document.querySelector(`.row[data-id="${c.id}"]`);el&&el.classList.add('out');
 setTimeout(()=>{const n=visible().find(x=>x.id!==c.id&&(nx&&x.id===nx.id))||null;S.sel=n?n.id:null;renderList(false);renderThread();renderCtx();if(n&&n.un)select(n.id);
  toast('Conversation closed',()=>{c.st='open';select(c.id);renderList(false)},'Undo')},190)}
function assign(c,v){c.as=v;renderList(false);renderThread();toast(v?'Assigned to you':'Unassigned')}
let tt;function toast(msg,fn,label){const t=$('toast');t.innerHTML=`<span>${msg}</span>${fn?`<button>${label}</button>`:''}`;if(fn)t.querySelector('button').onclick=()=>{fn();t.classList.remove('show')};t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),fn?5000:2000)}
let pp;function pop(anchor,items,curIdx,title){closePop();const r=anchor.getBoundingClientRect(),p=document.createElement('div');p.className='pop';p.setAttribute('role','menu');
 p.innerHTML=(title?`<h5>${title}</h5>`:'')+items.map((it,i)=>`<button role="menuitem" class="${i===curIdx?'cur':''}">${it[3]?`<i style="width:8px;height:8px;border-radius:50%;background:${it[3]};flex:none;margin:0 3px"></i>`:I(it[1],'sm')}${esc(it[0])}${i===curIdx?`<span style="margin-left:auto;color:var(--accent);display:flex">${I('check','sm')}</span>`:''}</button>`).join('');
 document.body.appendChild(p);const h=p.offsetHeight,up=r.bottom+h+8>innerHeight;p.style.left=Math.min(r.left,innerWidth-p.offsetWidth-8)+'px';p.style.top=(up?r.top-h-6:r.bottom+6)+'px';if(up)p.style.transformOrigin='bottom left';
 p.querySelectorAll('button').forEach((b,i)=>b.onclick=()=>{closePop();items[i][2]()});pp=p;requestAnimationFrame(()=>{p.classList.add('show');p.querySelector('button').focus()})}
function closePop(){if(pp){const p=pp;pp=null;p.classList.remove('show');setTimeout(()=>p.remove(),140)}}
document.addEventListener('pointerdown',e=>{if(pp&&!pp.contains(e.target))closePop()});

/* ---------- wiring ---------- */
$('fi').innerHTML=I('filter');$('sri').innerHTML=I('search');$('clr').innerHTML=I('x');
$('sw').innerHTML=['normal','loading','empty','error'].map(k=>`<button data-k="${k}">${k}</button>`).join('');
$('sw').onclick=e=>e.target.dataset.k&&setState(e.target.dataset.k);
$('tabs').onclick=e=>{const b=e.target.closest('.tab');if(!b)return;S.tab=b.dataset.t;renderList()};
$('q').oninput=e=>{S.q=e.target.value;$('sr').classList.toggle('has',!!S.q);renderList(false)};
$('clr').onclick=()=>{$('q').value='';S.q='';$('sr').classList.remove('has');renderList(false);$('q').focus()};
$('rows').onclick=e=>{if(e.target.closest('#reset')){S.q='';S.tab='all';$('q').value='';$('sr').classList.remove('has');renderList();return}
 const r=e.target.closest('.row');if(!r)return;e.preventDefault();const c=C.find(x=>x.id===+r.dataset.id);
 select(c.id)};
document.addEventListener('keydown',e=>{const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea';
 if(e.key==='Escape'){if(pp)return closePop();if(S.panel&&matchMedia('(max-width:1280px)').matches)return togglePanel(false);if(typing){e.target.blur();return}S.sel=null;document.querySelectorAll('.row.on').forEach(r=>r.classList.remove('on'));renderThread();renderCtx();$('page').classList.remove('t');return}
 if(typing||e.metaKey||e.ctrlKey)return;
 if(e.key==='/'){e.preventDefault();$('q').focus()}
 else if(e.key==='c')togglePanel();
 else if(e.key==='e'&&cur())closeConv(cur());
 else if(e.key==='j'||e.key==='k'){const v=visible(),i=v.findIndex(x=>x.id===S.sel),n=v[e.key==='j'?i+1:i<0?0:i-1];if(n)select(n.id)}});
addEventListener('resize',moveInd);
renderList();renderThread();renderCtx();$('ctxw').classList.toggle('open',S.panel);
document.fonts&&document.fonts.ready.then(moveInd);
</script></body></html>
