<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI redesign A: one hub with tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="base.css">
<style>
/* A: four pages become one. A status strip answers "is it working, what does it cost, what needs me" before any tab is opened. */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:20px}
.strip>div{padding:14px 18px;border-right:1px solid var(--line);min-width:0}.strip>div:last-child{border-right:0}
.strip small{display:block;color:var(--ink3);font-size:12px;margin-bottom:3px}.strip b{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.strip .bar{margin-top:8px}
.ap{display:flex;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);transition:opacity .2s,transform .2s var(--ease)}.ap:last-child{border:0}.ap.out{transform:translateX(16px);opacity:0}
.ap .t{flex:1;min-width:0}.ap .t b{display:block;font-weight:600}.ap .t span{color:var(--ink3);font-size:12.5px}
.feed{padding:6px 18px 12px}.feed div{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}.feed div:last-child{border:0}.feed .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.feed p{margin:0;flex:1}.feed small{color:var(--ink3);font-size:12px;display:block}
.acc{border-bottom:1px solid var(--line)}.acc:last-child{border:0}.acc>button{width:100%;border:0;background:none;text-align:left;padding:14px 18px;display:flex;align-items:center;gap:12px}.acc>button:hover{background:var(--sub)}
.acc>button .t{flex:1}.acc>button .t b{display:block}.acc>button .t span{color:var(--ink3);font-size:12.5px}.acc>button .i.ch{transition:transform .2s var(--ease)}.acc.open>button .ch{transform:rotate(180deg)}
.acc .bd{display:none;padding:2px 18px 18px 64px}.acc.open .bd{display:block}
.toolrow{display:grid;grid-template-columns:1fr 190px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.toolrow:last-child{border:0}
.srch{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:10px;height:42px;padding:0 12px;margin-bottom:16px}.srch input{flex:1;border:0;outline:0;background:none;font-size:14px}.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,75,240,.15)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line2);border:0;position:relative;transition:background-color .2s}.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(14px)}
@media (max-width:900px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(2){border-right:0}.strip>div{border-bottom:1px solid var(--line)}}
</style></head><body>
<div class="app"><aside class="side" id="side"></aside><div class="main"><header class="top" id="top"></header>
<div class="scroll"><div class="wrap">
<div class="crumb">Settings</div><h1>AI and automation</h1>
<p class="sub">What your assistant and your rules do, in one place. AI only writes drafts and proposes actions: a person always decides.</p>
<div class="panel strip" id="strip"></div>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view" class="view"></div>
</div></div></div></div>
<div class="demo">Option A · sample data · <a href="index.html">all options</a></div>
<script src="base.js"></script>
<script>
const $=id=>document.getElementById(id);
let tab='overview',appr=[['Add the tag “VIP” to Nusrat Jahan','Support assistant · from her Instagram chat · 4 min ago'],['Assign Imran Hossain to Maya','Support assistant · asked about bulk pricing · 21 min ago'],['Create a follow-up task for Tanvir Ahmed','Rule “Welcome new contacts” · 1 h ago']];
const AG=[['Support assistant','Active · version 4','Reads 3 knowledge groups · 3 tools',1],['Order follow-up','Draft · not active yet','No knowledge · 1 tool',0]];
const SRC=[['Return and refund policy','doc','12 passages','Ready','Support assistant'],['Delivery areas and charges','text','4 passages','Ready','Support assistant'],['Price list, Eid collection','doc','31 passages','Ready','Support assistant, Order follow-up'],['Shop FAQ (web page)','globe','9 passages','Updating…','Support assistant'],['Supplier cost sheet','doc','6 passages','Ready','Nobody (internal)']];
const RULES=[['Welcome new contacts','When a contact is created → add tag “New”, create a follow-up task','Needs approval',1],['Assign big orders','When a lead is worth over 50,000 → assign to Maya','Needs approval',1],['Tag Instagram leads','When a lead comes from Instagram → add tag “IG”','Runs automatically',0]];
function strip(){ $('strip').innerHTML=`<div><small>Provider</small><b>Mock (offline) <span class="chip warn">MOCK</span></b></div><div><small>This month</small><b>$0.00 of $50.00</b><div class="bar"><i style="width:1%"></i></div></div><div><small>Waiting for you</small><b>${appr.length?`<span class="chip warn"><i class="dot"></i>${appr.length} approvals</span>`:'<span class="chip ok">Nothing waiting</span>'}</b></div><div><small>Automations</small><b><span class="chip ok"><i class="dot"></i>2 running</span><span class="chip">1 paused</span></b></div>`}
function tabs(){ const T=[['overview','Overview'],['agents','Agents'],['knowledge','Knowledge'],['auto','Automations'],['setup','Setup']];
 $('tabs').innerHTML=T.map(([k,l])=>`<button class="tab ${tab===k?'on':''}" role="tab" aria-selected="${tab===k}" data-k="${k}">${l}${k==='overview'&&appr.length?`<b>${appr.length}</b>`:''}</button>`).join('');
 $('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.k;tabs();view()})}
function view(){ const v=$('view');v.className='view';void v.offsetWidth;v.className='view';
 if(tab==='overview')v.innerHTML=`<div class="banner" style="margin-bottom:16px">${I('alert','sm')}<div><b>Using the mock provider.</b> Drafts are canned text and nothing leaves this server. Connect a real provider in Setup.</div></div><div class="grid2"><div class="panel"><div class="ph"><div><h2>Needs your approval</h2><p>Agents and rules wait here before they change anything.</p></div></div><div id="ap">${apr()}</div></div><div class="panel"><div class="ph"><div><h2>Recent activity</h2><p>Agents and rules, newest first.</p></div></div><div class="feed"><div><i class="d" style="background:#C79A2B"></i><p>Support assistant proposed “Add tag VIP”<small>Waiting for approval · 4 min</small></p></div><div><i class="d" style="background:#4FA57A"></i><p>Reply draft for Sadia Rahman<small>Draft ready, not sent · 12 min</small></p></div><div><i class="d" style="background:#4FA57A"></i><p>Rule “Tag Instagram leads” ran<small>Tagged “IG” on 2 leads · 40 min</small></p></div><div><i class="d" style="background:#D4685C"></i><p>Support assistant: provider error<small>Mock provider timed out · 2 h</small></p></div></div></div></div>`;
 if(tab==='agents')v.innerHTML=`<div class="panel"><div class="ph"><div><h2>Agents</h2><p>1 of 20 active agents used.</p></div><span class="sp"></span><button class="btn pri">${I('plus','sm')}New agent</button></div>${AG.map((a,i)=>`<div class="acc ${i===0?'open':''}"><button><span class="ic">${I('bot')}</span><span class="t"><b>${a[0]}</b><span>${a[1]} · ${a[2]}</span></span>${a[3]?'<span class="chip ok">Active</span>':'<span class="chip">Draft</span>'}${I('down','ch')}</button><div class="bd">${i===0?agentBody():'<p class="note">Open to edit instructions, tools and knowledge.</p>'}</div></div>`).join('')}</div>`;
 if(tab==='knowledge')v.innerHTML=`<div class="srch">${I('search')}<input id="kq" placeholder="Test what the assistant finds, e.g. “What is the refund policy?”" aria-label="Test retrieval"><button class="btn sm pri" id="kgo">Find</button></div><div id="kres"></div><div class="panel"><div class="ph"><div><h2>Sources</h2><p>5 of 200 sources · documents, pasted text and web pages. Everything stays in this workspace.</p></div><span class="sp"></span><button class="btn pri">${I('plus','sm')}Add source</button></div>${SRC.map(s=>`<div class="row"><span class="ic ${s[4].startsWith('Nobody')?'n':''}">${I(s[1])}</span><div class="t"><b>${s[0]}</b><span>${s[2]} · used by ${s[4]}</span></div>${s[3]==='Ready'?'<span class="chip ok">Ready</span>':'<span class="chip acc">'+s[3]+'</span>'}<button class="btn ghost sm" aria-label="More">${I('more')}</button></div>`).join('')}</div>`;
 if(tab==='auto')v.innerHTML=`<div class="panel" style="margin-bottom:16px"><div class="row"><span class="ic g">${I('shield')}</span><div class="t"><b>Automations are running</b><span>The kill switch stops every rule and every agent action at once.</span></div><button class="btn bad">${I('pause','sm')}Pause all</button></div></div><div class="panel"><div class="ph"><div><h2>Rules</h2><p>A rule runs when its trigger happens and every condition matches.</p></div><span class="sp"></span><button class="btn pri">${I('plus','sm')}New rule</button></div>${RULES.map(r=>`<div class="row"><span class="ic">${I('flow')}</span><div class="t"><b>${r[0]}</b><span>${r[1]}</span></div><span class="chip ${r[3]?'warn':''}">${r[2]}</span><button class="sw" role="switch" aria-checked="${r[0]!=='Assign big orders'}" aria-label="Enable ${r[0]}"></button></div>`).join('')}</div>`;
 if(tab==='setup')v.innerHTML=`<div class="panel">${[['spark','Provider and model','Mock (offline) · mock model, no cost',provider()],['book','Prompt','Reply suggestion · built-in prompt',prompt()],['wallet','Monthly budget','$50.00 cap · $0.00 used',budget()],['eye','What the provider can do','Text, vision, documents, transcription',caps()],['play','Media playground','Try an image or a file. Advanced.','<p class="note">Upload a sample to see what the model returns. Nothing is saved.</p>']].map((a,i)=>`<div class="acc ${i===0?'open':''}"><button><span class="ic n">${I(a[0])}</span><span class="t"><b>${a[1]}</b><span>${a[2]}</span></span>${I('down','ch')}</button><div class="bd">${a[3]}</div></div>`).join('')}</div>`;
 wire()}
const apr=()=>appr.length?appr.map((a,i)=>`<div class="ap" data-i="${i}"><span class="ic w">${I('bell')}</span><div class="t"><b>${a[0]}</b><span>${a[1]}</span></div><button class="btn sm" data-a="no">Reject</button><button class="btn sm pri" data-a="ok">Approve</button></div>`).join(''):`<div class="pb" style="text-align:center;padding:36px 18px"><span class="ic g" style="margin:0 auto 10px">${I('check')}</span><b>Nothing waiting</b><p class="note" style="margin:4px 0 0">When an agent or a rule wants to change something, it appears here.</p></div>`;
const agentBody=()=>`<div class="field"><label>Instructions</label><textarea rows="3">You answer for a small shop. Draft ONE short, friendly reply in the customer’s language. Never promise prices or dates you cannot know.</textarea></div><h3 style="margin:14px 0 4px">Tools</h3>${[['Look things up in Knowledge','Read only','Runs automatically'],['Add a note to the contact','Changes data','Needs approval'],['Assign an owner','Sensitive','Needs approval']].map(t=>`<div class="toolrow"><div><b style="font-weight:600">${t[0]}</b> <span class="chip ${t[1]==='Sensitive'?'bad':''}">${t[1]}</span></div><select class="sel"><option>Off</option><option ${t[2].startsWith('Runs')?'selected':''}>Runs automatically</option><option ${t[2].startsWith('Needs')?'selected':''}>Needs approval</option></select></div>`).join('')}<div style="display:flex;gap:8px;margin-top:14px"><button class="btn pri">Save as new version</button><button class="btn">${I('play','sm')}Test on a sample message</button></div>`;
const provider=()=>`<div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Provider</label><select class="sel"><option>Mock (offline) (default)</option><option>OpenRouter</option><option>Anthropic</option></select></div><div class="field"><label>Model</label><select class="sel"><option>Mock model (no cost)</option></select></div></div><div style="display:flex;gap:18px;margin:4px 0 12px"><label><input type="checkbox" checked> Enabled</label><label><input type="checkbox" checked> Use for reply suggestions</label></div><button class="btn pri">${I('spark','sm')}Save provider</button>`;
const prompt=()=>`<div class="field"><label>Prompt template</label><textarea rows="4">You are a customer-support assistant for a small business. Draft ONE reply to the customer's latest message…</textarea></div><button class="btn pri">Publish as new version</button> <span class="note">Using the built-in prompt.</span>`;
const budget=()=>`<div class="field" style="max-width:260px"><label>Monthly cap</label><input class="input" value="$50.00"></div><div class="bar" style="max-width:420px"><i style="width:1%"></i></div><p class="note">$0.00 used this month. At the cap, AI stops and says why.</p>`;
const caps=()=>`<div class="row" style="padding-left:0"><div class="t"><b>Text</b></div><span class="chip ok">Supported</span></div><div class="row" style="padding-left:0"><div class="t"><b>Vision (images)</b></div><span class="chip">Not on mock</span></div><div class="row" style="padding-left:0"><div class="t"><b>Documents</b></div><span class="chip">Not on mock</span></div>`;
function wire(){document.querySelectorAll('.acc>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
 document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true'));
 document.querySelectorAll('.ap button').forEach(b=>b.onclick=()=>{const row=b.closest('.ap'),i=+row.dataset.i;row.classList.add('out');setTimeout(()=>{appr.splice(i,1);strip();tabs();view()},200)});
 const go=$('kgo');if(go)go.onclick=()=>{$('kres').innerHTML=`<div class="panel" style="margin-bottom:16px"><div class="ph"><div><h2>Best matches</h2><p>These passages would be sent with the question.</p></div></div><div class="pb"><p style="margin:0 0 8px"><b>Return and refund policy</b> · passage 3<br><span class="note">…items can be returned within 7 days if unused and in original packaging. Refunds go back to the original payment method within 3 working days…</span></p><p style="margin:0"><b>Delivery areas and charges</b> · passage 1<br><span class="note">…Dhaka 60 BDT, outside Dhaka 120 BDT, 2 to 4 working days…</span></p></div></div>`}}
strip();tabs();view();
</script></body></html>
