<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI redesign C: agent workbench</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="base.css">
<style>
/* C: master-detail workbench. Pick an agent, and everything it uses (instructions, knowledge, tools, triggers, history) is in one place, with a test panel always beside it. */
.bar2{display:flex;align-items:center;gap:10px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar2 .pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--ink2)}.bar2 .pill:hover{background:var(--hover)}
.bar2 .pill.w{background:var(--warn-bg);border-color:transparent;color:var(--warn);font-weight:600}
.bench{display:grid;grid-template-columns:260px minmax(0,1fr) 340px;flex:1;min-height:0}
.ls{border-right:1px solid var(--line);background:#fff;overflow:auto;padding:14px 10px}
.ls h6{margin:14px 10px 6px;font-size:11.5px;font-weight:600;color:var(--ink3);display:flex;align-items:center}.ls h6:first-child{margin-top:2px}.ls h6 button{margin-left:auto;border:0;background:none;color:var(--accent-fg);display:grid;place-items:center;width:22px;height:22px;border-radius:6px}.ls h6 button:hover{background:var(--accent-s)}
.ls a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px}.ls a:hover{background:var(--hover)}.ls a.on{background:var(--accent-s);color:var(--accent-fg);font-weight:600}.ls a .dot{color:#4FA57A}.ls a .dot.off{color:var(--line2)}.ls a small{margin-left:auto;color:var(--ink3);font-size:11.5px;font-weight:500}
.mid{overflow:auto;background:var(--canvas)}.mid .in{padding:24px 28px 80px;max-width:780px}
.tst{border-left:1px solid var(--line);background:#fff;display:flex;flex-direction:column;min-height:0}
.tst .h{padding:14px 18px;border-bottom:1px solid var(--line)}.tst .b{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}.tst .f{padding:12px 18px;border-top:1px solid var(--line)}
.bub{padding:9px 13px;border-radius:14px;font-size:13.5px;max-width:92%}.bub.c{background:var(--hover);align-self:flex-start;border-bottom-left-radius:4px}.bub.a{background:var(--accent-s);color:#2B2380;align-self:flex-end;border-bottom-right-radius:4px}
.dry{border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;font-size:12.5px;background:var(--sub)}
.head{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px}.head .ic{width:44px;height:44px;border-radius:12px}
.seg{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px}.seg button{border:0;background:none;height:38px;padding:0 12px;font-weight:500;color:var(--ink3);position:relative}.seg button.on{color:var(--ink)}.seg button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:8px;cursor:pointer;transition:border-color .14s,background-color .14s}.chk:hover{border-color:var(--line2)}.chk.on{border-color:var(--accent);background:var(--accent-s)}.chk input{margin-top:3px;accent-color:var(--accent)}.chk b{display:block;font-weight:600}.chk span{color:var(--ink3);font-size:12.5px}
.toolrow{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.toolrow:last-child{border:0}
.pop{position:absolute;top:44px;left:0;width:380px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(23,22,31,.14);z-index:20;display:none}.pop.open{display:block}
@media (max-width:1180px){.bench{grid-template-columns:240px minmax(0,1fr)}.tst{display:none}}
@media (max-width:820px){.bench{grid-template-columns:1fr}.ls{border-right:0;border-bottom:1px solid var(--line);max-height:220px}}
</style></head><body>
<div class="app"><aside class="side" id="side"></aside><div class="main"><header class="top" id="top"></header>
<div class="bar2"><span style="font-weight:700;font-size:15px;margin-right:8px">AI and automation</span><span class="pill" data-go="prov">Provider: Mock <span class="chip warn" style="height:18px;font-size:11px">MOCK</span></span><span class="pill" data-go="prov">$0.00 of $50.00</span><span style="position:relative"><button class="pill w" id="apb"><i class="dot"></i><span id="apn">3</span> waiting for approval</button><div class="pop" id="pop"></div></span><span style="flex:1"></span><span class="note">AI only writes drafts and proposes actions.</span></div>
<div class="bench"><nav class="ls" id="ls" aria-label="Agents, rules and library"></nav><div class="mid"><div class="in view" id="view"></div></div><aside class="tst" id="tst" aria-label="Test"></aside></div></div></div>
<div class="demo">Option C · sample data · <a href="index.html">all options</a></div>
<script src="base.js"></script>
<script>
const $=id=>document.getElementById(id);let sel='ag0',sub='instr',appr=[['Add the tag “VIP” to Nusrat Jahan','Support assistant','4 min ago'],['Assign Imran Hossain to Maya','Support assistant','21 min ago'],['Create a follow-up task for Tanvir Ahmed','Rule: Welcome new contacts','1 h ago']];
const GROUPS=[['Policies','Return and refund policy, delivery areas and charges',1],['Prices','Price list, shop FAQ',1],['Internal','Supplier cost sheet. Staff only.',0]];
function ls(){$('ls').innerHTML=`<h6>Agents <button aria-label="New agent">${I('plus','sm')}</button></h6><a href="#" data-s="ag0" class="${sel==='ag0'?'on':''}"><i class="dot" style="color:#4FA57A"></i>Support assistant<small>v4</small></a><a href="#" data-s="ag1" class="${sel==='ag1'?'on':''}"><i class="dot off"></i>Order follow-up<small>draft</small></a><h6>Rules <button aria-label="New rule">${I('plus','sm')}</button></h6><a href="#" data-s="ru0" class="${sel==='ru0'?'on':''}">${I('flow','sm')}Welcome new contacts</a><a href="#" data-s="ru1" class="${sel==='ru1'?'on':''}">${I('flow','sm')}Assign big orders<small>paused</small></a><a href="#" data-s="ru2" class="${sel==='ru2'?'on':''}">${I('flow','sm')}Tag Instagram leads</a><h6>Shared</h6><a href="#" data-s="lib" class="${sel==='lib'?'on':''}">${I('book','sm')}Knowledge library<small>5</small></a><a href="#" data-s="prov" class="${sel==='prov'?'on':''}">${I('spark','sm')}Provider and budget</a>`;
 $('ls').querySelectorAll('a').forEach(a=>a.onclick=e=>{e.preventDefault();sel=a.dataset.s;sub='instr';ls();view();tst()})}
function view(){const v=$('view');v.className='in';void v.offsetWidth;v.className='in view';
 if(sel.startsWith('ag')){const act=sel==='ag0';
  v.innerHTML=`<div class="head"><span class="ic">${I('bot')}</span><div style="flex:1"><h1 style="font-size:22px">${act?'Support assistant':'Order follow-up'}</h1><p class="sub" style="margin-top:2px">${act?'Drafts replies and proposes actions. Never sends a message itself.':'Draft. Not active yet.'}</p></div>${act?'<span class="chip ok"><i class="dot"></i>Active · v4</span>':'<span class="chip">Draft</span>'}<button class="btn pri">${act?'Save as new version':'Activate'}</button></div>
  <div class="seg" role="tablist">${[['instr','Instructions'],['know','Knowledge'],['tools','Tools'],['when','When it runs'],['hist','History']].map(([k,l])=>`<button class="${sub===k?'on':''}" data-k="${k}">${l}</button>`).join('')}</div><div id="sv"></div>`;
  v.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{sub=b.dataset.k;view()});
  const s=$('sv');
  if(sub==='instr')s.innerHTML=`<div class="panel pb"><div class="field"><label>Name</label><input class="input" value="${act?'Support assistant':'Order follow-up'}"></div><div class="field"><label>Instructions</label><textarea rows="6">${act?'You answer for a small shop. Draft ONE short, friendly reply in the customer’s language (Bangla or English). Never promise prices, discounts or dates you cannot know. Output only the reply text.':''}</textarea><span class="note">Each save is a new version. To roll back, activate an older one.</span></div><div class="field" style="max-width:320px"><label>Model</label><select class="sel"><option>Workspace default (Mock model)</option></select></div></div>`;
  if(sub==='know')s.innerHTML=`<p class="note" style="margin:0 0 12px">Choose which groups from the Knowledge library this agent may read. It only sees what you tick.</p>${GROUPS.map((g,i)=>`<label class="chk ${g[2]&&act?'on':''}"><input type="checkbox" ${g[2]&&act?'checked':''}><div><b>${g[0]}</b><span>${g[1]}</span></div></label>`).join('')}<a href="#" data-s="lib" id="tolib">Manage the library ${'→'}</a>`;
  if(sub==='tools')s.innerHTML=`<div class="panel pb">${[['Look things up in Knowledge','Read only','Runs automatically'],['Add a note to the contact','Changes data','Needs approval'],['Assign an owner','Sensitive','Needs approval'],['Create a task','Changes data','Off']].map(t=>`<div class="toolrow"><div><b style="font-weight:600">${t[0]}</b> <span class="chip ${t[1]==='Sensitive'?'bad':''}">${t[1]}</span></div><select class="sel"><option ${t[2]==='Off'?'selected':''}>Off</option>${t[1]!=='Sensitive'?`<option ${t[2].startsWith('Runs')?'selected':''}>Runs automatically</option>`:''}<option ${t[2].startsWith('Needs')?'selected':''}>Needs approval</option></select></div>`).join('')}</div>`;
  if(sub==='when')s.innerHTML=`<div class="panel"><div class="ph"><div><h2>Rules that call this agent</h2><p>An agent can also be used by hand, from “Suggest reply” in the inbox.</p></div></div><div class="row"><span class="ic n">${I('flow')}</span><div class="t"><b>Welcome new contacts</b><span>When a contact is created → draft a first reply</span></div><span class="chip warn">Needs approval</span></div><div class="row"><span class="ic n">${I('msg')}</span><div class="t"><b>Inbox · Suggest reply</b><span>A person clicks it. The draft is never sent automatically.</span></div><span class="chip ok">On</span></div></div>`;
  if(sub==='hist')s.innerHTML=`<div class="panel">${[['Reply draft for Sadia Rahman','Draft ready, not sent','12 min','ok'],['Proposed “Add tag VIP”','Waiting for approval','4 min','warn'],['Provider error','Mock provider timed out','2 h','bad']].map(r=>`<div class="row"><div class="t"><b>${r[0]}</b><span>${r[1]} · ${r[2]} ago</span></div><span class="chip ${r[3]}">${r[3]==='ok'?'Done':r[3]==='warn'?'Pending':'Failed'}</span></div>`).join('')}</div><p class="note">Older versions: v3 (Nov 12), v2 (Nov 9), v1 (Nov 8). <a href="#">Compare</a></p>`;
  const tl=$('tolib');if(tl)tl.onclick=e=>{e.preventDefault();sel='lib';ls();view();tst()};
  v.querySelectorAll('.chk input').forEach(i=>i.onchange=()=>i.closest('.chk').classList.toggle('on',i.checked));
 } else if(sel.startsWith('ru')){const names=['Welcome new contacts','Assign big orders','Tag Instagram leads'],n=+sel[2];
  v.innerHTML=`<div class="head"><span class="ic n">${I('flow')}</span><div style="flex:1"><h1 style="font-size:22px">${names[n]}</h1><p class="sub" style="margin-top:2px">A rule runs when its trigger happens and every condition matches.</p></div><button class="btn">${n===1?'Resume':'Pause'}</button></div><div class="panel" style="margin-top:16px"><div class="pb"><div class="field"><label>When</label><select class="sel"><option>A contact is created</option></select></div><div class="field"><label>Only if</label><div class="note">No conditions: every contact matches.</div></div><div class="field"><label>Then</label><select class="sel"><option>Add a tag</option></select></div><label><input type="checkbox" ${n<2?'checked':''}> Require approval for every run</label></div></div><div class="panel" style="margin-top:16px"><div class="ph"><div><h2>Recent runs</h2></div></div><div class="row"><div class="t"><b>Nusrat Jahan</b><span>Waiting for approval · 1 h ago</span></div><button class="btn sm">Reject</button><button class="btn sm pri">Approve</button></div><div class="row"><div class="t"><b>Rahim Uddin</b><span>Done · yesterday</span></div><span class="chip ok">Done</span></div></div>`;
 } else if(sel==='lib'){
  v.innerHTML=`<div class="head"><span class="ic">${I('book')}</span><div style="flex:1"><h1 style="font-size:22px">Knowledge library</h1><p class="sub" style="margin-top:2px">Documents, pasted text and web pages. Group them, then choose which agents read each group.</p></div><button class="btn pri">${I('plus','sm')}Add source</button></div><div class="panel" style="margin-top:16px"><div class="pb" style="display:flex;gap:8px"><input class="input" placeholder="Test what an agent would find…" aria-label="Test retrieval" id="kq"><button class="btn pri" id="kgo">Find</button></div><div id="kres"></div></div>${GROUPS.map(g=>`<div class="panel" style="margin-top:16px"><div class="ph"><div><h2>${g[0]}</h2><p>${g[1]}</p></div><span class="sp"></span><span class="chip ${g[2]?'acc':''}">${g[2]?'Read by Support assistant':'No agent can read this'}</span></div></div>`).join('')}`;
  const go=$('kgo');if(go)go.onclick=()=>{$('kres').innerHTML=`<div class="pb" style="padding-top:0"><p style="margin:6px 0 0"><b>Return and refund policy</b> · Policies<br><span class="note">…items can be returned within 7 days if unused…</span></p></div>`}
 } else {
  v.innerHTML=`<div class="head"><span class="ic">${I('spark')}</span><div style="flex:1"><h1 style="font-size:22px">Provider and budget</h1><p class="sub" style="margin-top:2px">Shared by every agent. Rarely changed.</p></div></div><div class="banner" style="margin:16px 0">${I('alert','sm')}<div><b>Mock provider.</b> Drafts are canned text and nothing leaves this server.</div></div><div class="panel pb"><div class="grid2" style="grid-template-columns:1fr 1fr"><div class="field"><label>Provider</label><select class="sel"><option>Mock (offline)</option><option>OpenRouter</option></select></div><div class="field"><label>Model</label><select class="sel"><option>Mock model (no cost)</option></select></div></div><div class="field" style="max-width:240px"><label>Monthly cap</label><input class="input" value="$50.00"></div><div class="bar" style="max-width:420px"><i style="width:1%"></i></div><p class="note">$0.00 used this month.</p><button class="btn pri">Save</button></div>`}
 $('apn').textContent=appr.length;
}
function tst(){const t=$('tst');if(!sel.startsWith('ag')){t.style.display='none';return}t.style.display='';t.innerHTML=`<div class="h"><h2>Test</h2><p class="note" style="margin:2px 0 0">A dry run on a sample message. It changes nothing.</p></div><div class="b" id="tb"><div class="bub c bn" style="font-family:'Noto Sans Bengali','Plus Jakarta Sans',sans-serif">দাদা, নীল জ্যাকেটটা কি স্টকে আছে? Friday-র মধ্যে লাগবে।</div></div><div class="f"><div class="field" style="margin-bottom:8px"><select class="sel"><option>Sample: Nusrat Jahan (Instagram)</option><option>No contact</option></select></div><button class="btn pri" style="width:100%;justify-content:center" id="run">${I('play','sm')}Run test</button></div>`;
 $('run').onclick=()=>{$('tb').insertAdjacentHTML('beforeend',`<div class="bub a bn">জি, ৩টা আছে। Chattogram-এ Thursday-তে পৌঁছে যাবে।</div><div class="dry"><b>Draft, never sent</b><br><br><b>Would do:</b><br>• Look up “blue jacket” in Knowledge<br>• Add tag “VIP” <span class="chip warn" style="height:18px;font-size:11px">would wait for approval</span></div>`);$('tb').scrollTop=1e5}}
function pop(){ $('pop').innerHTML=`<div class="ph"><div><h2>Waiting for your approval</h2></div></div>${appr.length?appr.map((a,i)=>`<div class="row" data-i="${i}"><div class="t"><b style="font-size:13px">${a[0]}</b><span>${a[1]} · ${a[2]}</span></div><button class="btn sm pri">Approve</button></div>`).join(''):'<div class="pb note">Nothing waiting.</div>'}`;$('pop').querySelectorAll('.row .btn').forEach(b=>b.onclick=()=>{appr.splice(+b.closest('.row').dataset.i,1);$('apn').textContent=appr.length;pop()})}
$('apb').onclick=e=>{e.stopPropagation();pop();$('pop').classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('#pop'))$('pop').classList.remove('open')});
document.querySelectorAll('[data-go]').forEach(p=>p.onclick=()=>{sel='prov';ls();view();tst()});
ls();view();tst();
</script></body></html>
