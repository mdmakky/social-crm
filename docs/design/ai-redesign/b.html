<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI redesign B: Work, Knowledge, Controls</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="base.css">
<style>
/* B: split by what a person wants to do. Work = things that act (agents and rules together, one approval queue, one activity log). Knowledge = what it knows. Controls = the rare, global settings. */
.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.sn{position:sticky;top:0;display:flex;flex-direction:column;gap:4px}
.sn button{border:0;background:none;text-align:left;padding:11px 14px;border-radius:10px;display:flex;gap:12px;align-items:flex-start;transition:background-color .14s}
.sn button:hover{background:var(--hover)}.sn button.on{background:#fff;box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(23,22,31,.04)}
.sn button .ic{width:30px;height:30px;border-radius:8px}.sn b{display:block;font-weight:600;font-size:14px}.sn span.s{display:block;color:var(--ink3);font-size:12.5px;line-height:1.35;margin-top:1px}
.sn button.on .ic{background:var(--accent);color:#fff}
.sn .badge{margin-left:auto;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:11.5px;border-radius:99px;padding:0 8px;height:20px;line-height:20px}
.ap{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);transition:opacity .2s,transform .2s var(--ease)}.ap:last-child{border:0}.ap.out{opacity:0;transform:translateX(14px)}.ap .t{flex:1;min-width:0}.ap .t b{display:block}.ap .t span{color:var(--ink3);font-size:12.5px}
.who{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px}.who.ag{background:var(--accent-s);color:var(--accent-fg)}.who.ru{background:var(--hover);color:var(--ink2)}
.sw{width:34px;height:20px;border-radius:99px;background:var(--line2);border:0;position:relative}.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s var(--ease)}.sw[aria-checked=true]{background:var(--accent)}.sw[aria-checked=true]::after{transform:translateX(14px)}
.tl{padding:8px 18px 14px;position:relative}.tl div{display:flex;gap:12px;padding:8px 0;position:relative}.tl div::before{content:"";position:absolute;left:4px;top:22px;bottom:-8px;width:1px;background:var(--line)}.tl div:last-child::before{display:none}.tl .d{width:9px;height:9px;border-radius:50%;margin-top:6px;flex:none;position:relative;z-index:1}.tl small{color:var(--ink3);font-size:12px;display:block}.tl p{margin:0}
.col{margin-bottom:16px}.col h2{display:flex;align-items:center;gap:8px}
.srch{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line2);border-radius:10px;height:42px;padding:0 12px;margin-bottom:16px}.srch input{flex:1;border:0;outline:0;background:none;font-size:14px}.srch:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,75,240,.15)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{padding:16px 18px;display:flex;flex-direction:column;gap:10px}.card .big{font-size:18px;font-weight:700;letter-spacing:-.01em}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;border-left:1px solid var(--line);box-shadow:-18px 0 40px rgba(23,22,31,.1);transform:translateX(102%);visibility:hidden;transition:transform .26s var(--ease),visibility 0s .26s;z-index:30;display:flex;flex-direction:column}.drawer.open{transform:none;visibility:visible;transition:transform .26s var(--ease)}
.drawer .dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.drawer .dh h2{flex:1}.drawer .db{padding:18px 20px;overflow:auto;flex:1}.drawer .df{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
@media (max-width:1000px){.lay{grid-template-columns:1fr}.sn{position:static;flex-direction:row;overflow:auto}.sn button .s{display:none}.cards{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="side" id="side"></aside><div class="main"><header class="top" id="top"></header>
<div class="scroll"><div class="wrap">
<div class="crumb">Settings</div><h1>AI and automation</h1>
<p class="sub">Three places, named for what you want to do. AI only writes drafts and proposes actions: a person always decides.</p>
<div class="lay" style="margin-top:24px"><nav class="sn" id="sn" aria-label="AI and automation"></nav><div id="view" class="view"></div></div>
</div></div></div></div>
<div class="drawer" id="dr" role="dialog" aria-label="Edit"></div>
<div class="demo">Option B · sample data · <a href="index.html">all options</a></div>
<script src="base.js"></script>
<script>
const $=id=>document.getElementById(id);let pg='work',appr=[['Add the tag “VIP” to Nusrat Jahan','ag','Support assistant','from her Instagram chat · 4 min ago'],['Assign Imran Hossain to Maya','ag','Support assistant','asked about bulk pricing · 21 min ago'],['Create a follow-up task for Tanvir Ahmed','ru','Rule: Welcome new contacts','1 h ago']];
const RUN=[['bot','Support assistant','agent','Drafts replies and proposes actions · version 4','Needs approval for changes',1],['bot','Order follow-up','agent','Not active yet · draft','—',0],['flow','Welcome new contacts','rule','When a contact is created → tag “New”, create a task','Needs approval',1],['flow','Assign big orders','rule','When a lead is worth over 50,000 → assign to Maya','Needs approval',0],['flow','Tag Instagram leads','rule','When a lead comes from Instagram → tag “IG”','Runs automatically',1]];
const COL=[['Policies','Anyone with the assistant can read',[['Return and refund policy','12 passages'],['Delivery areas and charges','4 passages']],'Support assistant'],['Prices','Customer-facing',[['Price list, Eid collection','31 passages'],['Shop FAQ (web page)','9 passages']],'Support assistant, Order follow-up'],['Internal','Hidden from every agent',[['Supplier cost sheet','6 passages']],'Nobody']];
function nav(){const N=[['work','Work','bot','Agents and rules that act, with one approval queue and one activity log.',appr.length],['know','Knowledge','book','What the assistant can look things up in.',0],['ctl','Controls','cog','Provider, model, prompt and monthly budget.',0]];
 $('sn').innerHTML=N.map(n=>`<button class="${pg===n[0]?'on':''}" data-p="${n[0]}"><span class="ic">${I(n[2])}</span><span><b>${n[1]}</b><span class="s">${n[3]}</span></span>${n[4]?`<span class="badge">${n[4]}</span>`:''}</button>`).join('');
 $('sn').querySelectorAll('button').forEach(b=>b.onclick=()=>{pg=b.dataset.p;nav();view()})}
function view(){const v=$('view');v.className='';void v.offsetWidth;v.className='view';
 if(pg==='work')v.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:16px"><span class="sp" style="flex:1"></span><button class="btn">${I('plus','sm')}New rule</button><button class="btn pri">${I('plus','sm')}New agent</button></div>
 <div class="panel col"><div class="ph"><div><h2>Needs your approval ${appr.length?`<span class="chip warn">${appr.length}</span>`:''}</h2><p>Agents and rules wait here before they change anything.</p></div></div>${appr.length?appr.map((a,i)=>`<div class="ap" data-i="${i}"><span class="who ${a[1]}">${a[1]==='ag'?'Agent':'Rule'}</span><div class="t"><b>${a[0]}</b><span>${a[2]} · ${a[3]}</span></div><button class="btn sm" data-a>Reject</button><button class="btn sm pri" data-a>Approve</button></div>`).join(''):`<div style="text-align:center;padding:32px"><b>Nothing waiting</b><p class="note" style="margin:4px 0 0">Anything an agent or a rule wants to change shows up here.</p></div>`}</div>
 <div class="panel col"><div class="ph"><div><h2>Everything that runs</h2><p>Agents and rules in one list.</p></div><span class="sp"></span><button class="btn sm ghost">${I('pause','sm')}Pause all</button></div>${RUN.map(r=>`<div class="row"><span class="ic ${r[2]==='rule'?'n':''}">${I(r[0])}</span><div class="t"><b>${r[1]} <span class="who ${r[2]==='agent'?'ag':'ru'}">${r[2]==='agent'?'Agent':'Rule'}</span></b><span>${r[3]}</span></div><span class="chip ${r[4].startsWith('Needs')?'warn':''}">${r[4]}</span><button class="sw" role="switch" aria-checked="${!!r[5]}" aria-label="Turn ${r[1]} on or off"></button></div>`).join('')}</div>
 <div class="panel"><div class="ph"><div><h2>Activity</h2><p>Agent runs and rule runs, newest first.</p></div></div><div class="tl"><div><i class="d" style="background:#C79A2B"></i><p><b>Support assistant</b> proposed “Add tag VIP”<small>Waiting for approval · 4 min</small></p></div><div><i class="d" style="background:#4FA57A"></i><p>Reply draft ready for <b>Sadia Rahman</b><small>Not sent · 12 min</small></p></div><div><i class="d" style="background:#4FA57A"></i><p>Rule <b>Tag Instagram leads</b> tagged 2 leads<small>40 min</small></p></div><div><i class="d" style="background:#D4685C"></i><p><b>Support assistant</b> failed: provider timed out<small>2 h</small></p></div></div></div>`;
 if(pg==='know')v.innerHTML=`<div class="srch">${I('search')}<input id="kq" placeholder="Ask a question to see what the assistant would find" aria-label="Test retrieval"><button class="btn sm pri" id="kgo">Find</button></div><div id="kres"></div><div style="display:flex;gap:8px;margin-bottom:12px"><span style="flex:1"><h2 style="margin-top:4px">Library</h2><p class="note" style="margin:2px 0 0">5 of 200 sources. Group sources, then choose which agents may read each group.</p></span><button class="btn">${I('plus','sm')}New group</button><button class="btn pri">${I('plus','sm')}Add source</button></div>${COL.map(c=>`<div class="panel col"><div class="ph"><div><h2>${c[0]}</h2><p>${c[1]}</p></div><span class="sp"></span><span class="chip ${c[3]==='Nobody'?'':'acc'}">${I(c[3]==='Nobody'?'lock':'users','sm')}${c[3]==='Nobody'?'No agent can read this':'Read by '+c[3]}</span><button class="btn ghost sm" data-edit="${c[0]}">Choose agents</button></div>${c[2].map(s=>`<div class="row"><span class="ic n">${I('doc')}</span><div class="t"><b>${s[0]}</b><span>${s[1]} · Ready</span></div><button class="btn ghost sm" aria-label="More">${I('more')}</button></div>`).join('')}</div>`).join('')}`;
 if(pg==='ctl')v.innerHTML=`<div class="cards"><div class="panel card"><span class="ic">${I('spark')}</span><div><small class="note">Provider and model</small><div class="big">Mock (offline)</div><span class="chip warn" style="margin-top:6px">MOCK · no real AI</span></div><button class="btn" data-edit="provider">Change</button></div><div class="panel card"><span class="ic g">${I('wallet')}</span><div><small class="note">This month</small><div class="big">$0.00 <span class="note" style="font-weight:500">of $50.00</span></div><div class="bar" style="margin-top:10px"><i style="width:1%"></i></div></div><button class="btn" data-edit="budget">Set the cap</button></div><div class="panel card"><span class="ic n">${I('book')}</span><div><small class="note">Reply prompt</small><div class="big">Built-in</div><span class="note">Each save is a new version</span></div><button class="btn" data-edit="prompt">Edit prompt</button></div></div><div class="panel" style="margin-top:16px"><div class="ph"><div><h2>Advanced</h2><p>Rarely needed.</p></div></div><div class="row"><span class="ic n">${I('eye')}</span><div class="t"><b>What the provider can do</b><span>Text, vision, documents, transcription</span></div>${I('right')}</div><div class="row"><span class="ic n">${I('play')}</span><div class="t"><b>Media playground</b><span>Try an image or a file against the provider</span></div>${I('right')}</div></div>`;
 wire()}
function drawer(kind){const D={provider:['Provider and model',`<div class="field"><label>Provider</label><select class="sel"><option>Mock (offline) (default)</option><option>OpenRouter</option><option>Anthropic</option></select></div><div class="field"><label>Model</label><select class="sel"><option>Mock model (no cost)</option></select></div><label style="display:block;margin-bottom:8px"><input type="checkbox" checked> Enabled</label><label><input type="checkbox" checked> Use for reply suggestions</label>`],budget:['Monthly budget',`<div class="field"><label>Monthly cap</label><input class="input" value="$50.00"></div><p class="note">At the cap, AI stops and says why. Nothing is charged beyond it.</p>`],prompt:['Reply prompt',`<div class="field"><label>Prompt template</label><textarea rows="8">You are a customer-support assistant for a small business. Draft ONE reply to the customer's latest message…</textarea></div>`]};
 const g=D[kind]||[kind+' · who can read it',`<p class="note" style="margin-top:0">Choose which agents may read this group.</p><label style="display:block;margin-bottom:10px"><input type="checkbox" checked> Support assistant</label><label><input type="checkbox"> Order follow-up</label>`];
 $('dr').innerHTML=`<div class="dh"><h2>${g[0]}</h2><button class="btn ghost sm" id="dx" aria-label="Close">${I('x')}</button></div><div class="db">${g[1]}</div><div class="df"><button class="btn" id="dc">Cancel</button><button class="btn pri" id="ds">Save</button></div>`;$('dr').classList.add('open');['dx','dc','ds'].forEach(i=>$(i).onclick=()=>$('dr').classList.remove('open'))}
function wire(){document.querySelectorAll('.sw').forEach(s=>s.onclick=()=>s.setAttribute('aria-checked',s.getAttribute('aria-checked')!=='true'));
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>drawer(b.dataset.edit));
 document.querySelectorAll('.ap [data-a]').forEach(b=>b.onclick=()=>{const r=b.closest('.ap');r.classList.add('out');setTimeout(()=>{appr.splice(+r.dataset.i,1);nav();view()},200)});
 const go=$('kgo');if(go)go.onclick=()=>{$('kres').innerHTML=`<div class="panel" style="margin-bottom:16px"><div class="ph"><div><h2>Best matches</h2><p>Only groups an agent may read are searched.</p></div></div><div class="pb"><p style="margin:0 0 8px"><b>Return and refund policy</b> · Policies<br><span class="note">…items can be returned within 7 days if unused and in original packaging…</span></p><p style="margin:0"><b>Delivery areas and charges</b> · Policies<br><span class="note">…Dhaka 60 BDT, outside Dhaka 120 BDT…</span></p></div></div>`}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('dr').classList.remove('open')});
nav();view();
</script></body></html>
