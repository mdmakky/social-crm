<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login option B: Composer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500&display=swap"><link rel="stylesheet" href="base.css">
<style>
/* B: the sign-in card is a reply box. Customers' messages drift around it, so you land already "in the conversation". */
body{overflow-x:hidden}
.stage{min-height:100vh;display:grid;place-items:center;padding:96px 20px 64px;position:relative}
.brand{position:absolute;left:32px;top:28px}
.help{position:absolute;right:32px;top:30px;font-size:13px;color:var(--ink2)}
.card{position:relative;z-index:2;width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px rgba(23,22,31,.08),0 2px 6px rgba(23,22,31,.04)}
.tabs{display:flex;gap:4px;padding:10px 10px 0}
.tabs button{border:0;background:none;height:34px;padding:0 14px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink3);display:flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}.tabs button.on{background:var(--accent-s);color:var(--accent-fg)}
.body{padding:22px 28px 26px}
.card .form h1{font-size:26px}
.bar{border-top:1px solid var(--line);background:var(--sub);border-radius:0 0 20px 20px;padding:12px 18px;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.bar .i{width:15px;height:15px}.bar span{display:inline-flex;align-items:center;gap:6px}.bar .sp2{margin-left:auto}
kbd{font:600 11px var(--font);border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:#fff;color:var(--ink2)}
.drift{position:absolute;inset:0;z-index:1;pointer-events:none}
.msg{position:absolute;max-width:260px;padding:10px 14px;border-radius:16px;font-size:14px;display:flex;gap:9px;align-items:flex-start;border:1px solid transparent}
.msg .m{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none;margin-top:1px}.msg .m .i{width:12px;height:12px;stroke-width:2.2}
.msg small{display:block;font-size:11.5px;margin-top:2px;opacity:1}
.h1{background:#ECEAF8;color:#4B4199;border-bottom-left-radius:4px}.h1 small{color:#5A4FB0}
.h2{background:#E4F1EA;color:#25593B;border-bottom-left-radius:4px}.h2 small{color:#2F6B49}
.h3{background:#F6EED6;color:#5E470F;border-bottom-left-radius:4px}.h3 small{color:#6B5313}
.h4{background:#F8E8DE;color:#7C3F1C;border-bottom-left-radius:4px}.h4 small{color:#8A4A26}
.h5{background:#E3EEF8;color:#264F7B;border-bottom-left-radius:4px}.h5 small{color:#2F5C8C}
.m.mm{background:var(--messenger)}.m.ig{background:var(--ig)}.m.wa{background:var(--wa)}
.p1{left:6%;top:20%}.p2{left:3%;top:56%}.p3{left:15%;top:78%}.p4{right:5%;top:17%}.p5{right:3%;top:48%}.p6{right:13%;top:74%}
@media (max-width:1100px){.p2,.p5{display:none}}
@media (max-width:760px){.drift{display:none}.brand{left:20px}.help{display:none}.stage{padding-top:84px;align-items:start}}
@media (prefers-reduced-motion:no-preference){.msg{animation:in .7s var(--ease) both}.p2{animation-delay:.1s}.p3{animation-delay:.2s}.p4{animation-delay:.15s}.p5{animation-delay:.25s}.p6{animation-delay:.35s}.card{animation:in .5s var(--ease) both}@keyframes in{from{transform:translateY(10px)}}}
</style></head><body>
<div class="stage">
 <div class="brand" id="lg"></div><div class="help">Need help? <a href="#">Contact support</a></div>
 <div class="drift bn" aria-hidden="true">
  <div class="msg h1 p1"><span class="m mm" id="a1"></span><div>Price for 3 units to Chattogram?<small>Messenger · 1h</small></div></div>
  <div class="msg h2 p2"><span class="m wa" id="a2"></span><div>অর্ডার কনফার্ম করলাম 🙏<small>WhatsApp · 5m</small></div></div>
  <div class="msg h4 p3"><span class="m ig" id="a3"></span><div>Is the blue one still available?<small>Instagram · 24m</small></div></div>
  <div class="msg h5 p4"><span class="m ig" id="a4"></span><div>Can you deliver by Friday?<small>Instagram · 2m</small></div></div>
  <div class="msg h3 p5"><span class="m mm" id="a5"></span><div>ধন্যবাদ, পেয়েছি!<small>Messenger · 3h</small></div></div>
  <div class="msg h1 p6"><span class="m wa" id="a6"></span><div>Please share your bKash number<small>WhatsApp · 11m</small></div></div>
 </div>
 <div class="card">
  <div class="tabs" role="tablist"><button role="tab" data-t="login">Sign in</button><button role="tab" data-t="register">Create account</button></div>
  <div class="body"><div id="form"></div></div>
  <div class="bar"><span id="bl"></span><span class="sp2"><kbd>Enter</kbd> to continue</span></div>
 </div>
</div>
<script src="base.js"></script>
<script>$('lg').innerHTML=LOGO;[['a1','msg'],['a2','phone'],['a3','cam'],['a4','cam'],['a5','msg'],['a6','phone']].forEach(([k,n])=>$(k).innerHTML=I(n));
$('bl').innerHTML=I('lock')+'Encrypted session';
const tabs=document.querySelectorAll('.tabs button');
tabs.forEach(b=>b.onclick=()=>{mode=b.dataset.t;state='normal';paint();syncSw()});
document.addEventListener('painted',e=>tabs.forEach(b=>{const on=b.dataset.t===e.detail.mode||(e.detail.mode==='forgot'&&false);b.classList.toggle('on',on);b.setAttribute('aria-selected',on)}));</script></body></html>
